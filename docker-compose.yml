name: skintriage

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skintriage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skintriage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging
    # No "ports": the database is only reachable inside the Docker network.

  backend:
    build: ./backend
    image: skintriage-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skintriage}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skintriage}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: '["${PUBLIC_URL:-http://localhost:8080}"]'
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      EMAIL_FROM: ${EMAIL_FROM:-SkinTriage <no-reply@skintriage.local>}
      SEED_ON_START: ${SEED_ON_START:-true}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      - uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging
    # No "ports": reached only through the frontend's nginx proxy.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: skintriage-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logging

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8026:8025"   # web inbox (8025 is used by the dev Mailpit)
    logging: *logging

volumes:
  pgdata:
  uploads:
