# Production overrides. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    ports: !reset []          # only reachable through Caddy

  mailpit:
    ports: !override
      - "127.0.0.1:8026:8025" # inbox only visible from the server itself (use an SSH tunnel)

volumes:
  caddy_data:
  caddy_config:
